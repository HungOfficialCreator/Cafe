<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebCraft - Sinh Tồn 2D</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #87CEEB; /* Màu bầu trời */
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
        }

        /* Giao diện người dùng (UI) */
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            text-shadow: 1px 1px 2px black;
            pointer-events: none;
        }

        .bar-container {
            width: 200px;
            height: 20px;
            background-color: rgba(0, 0, 0, 0.5);
            border: 2px solid #333;
            margin-bottom: 10px;
            border-radius: 5px;
            overflow: hidden;
        }

        #healthBar {
            width: 100%;
            height: 100%;
            background-color: #ff3333;
            transition: width 0.2s;
        }

        #hungerBar {
            width: 100%;
            height: 100%;
            background-color: #ffcc00;
            transition: width 0.2s;
        }

        #inventory {
            background-color: rgba(0, 0, 0, 0.6);
            padding: 10px;
            border-radius: 5px;
            display: inline-block;
            margin-top: 10px;
            font-weight: bold;
        }
        
        #deathScreen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            color: red;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        
        #deathScreen h1 { font-size: 5rem; margin: 0; }
        #deathScreen p { color: white; font-size: 1.5rem; cursor: pointer; text-decoration: underline;}
    </style>
</head>
<body>

    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="ui">
            <div>Máu (HP):</div>
            <div class="bar-container"><div id="healthBar"></div></div>
            <div>Thức ăn:</div>
            <div class="bar-container"><div id="hungerBar"></div></div>
            <div id="inventory">Gỗ: 0 | Đất: 0</div>
        </div>
        <div id="deathScreen">
            <h1>BẠN ĐÃ CHẾT!</h1>
            <p onclick="location.reload()">Bấm vào đây để Hồi Sinh</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const tileSize = 40; // Kích thước 1 khối block

        // --- CÁC LOẠI KHỐI (BLOCKS) ---
        // 0: Không khí, 1: Đất, 2: Cỏ, 3: Thân gỗ, 4: Lá cây, 5: Nước
        const colors = {
            1: '#8B4513', // Đất
            2: '#228B22', // Cỏ
            3: '#5C4033', // Gỗ
            4: '#006400', // Lá
            5: 'rgba(65, 105, 225, 0.6)' // Nước (Trong suốt)
        };

        // --- TẠO BẢN ĐỒ BẰNG MẢNG 2 CHIỀU ---
        const cols = Math.ceil(canvas.width / tileSize);
        const rows = Math.ceil(canvas.height / tileSize);
        let map = Array(rows).fill().map(() => Array(cols).fill(0));

        // Sinh địa hình cơ bản
        const groundLevel = Math.floor(rows / 2);
        for (let r = groundLevel; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                if (r === groundLevel) {
                    // Tạo một hồ nước nhỏ ở giữa bản đồ
                    if (c > cols/2 - 3 && c < cols/2 + 3) map[r][c] = 5; 
                    else map[r][c] = 2; // Cỏ
                } else if (map[r-1][c] === 5 && r === groundLevel + 1) {
                    map[r][c] = 5; // Làm hồ nước sâu 2 block
                } else {
                    map[r][c] = 1; // Đất
                }
            }
        }

        // Sinh cây
        function spawnTree(col) {
            let baseR = groundLevel - 1;
            map[baseR][col] = 3; map[baseR-1][col] = 3; map[baseR-2][col] = 3; // Thân
            map[baseR-3][col] = 4; map[baseR-3][col-1] = 4; map[baseR-3][col+1] = 4; // Lá
            map[baseR-4][col] = 4; // Chóp lá
        }
        spawnTree(5);
        spawnTree(cols - 8);

        // --- THÔNG SỐ NGƯỜI CHƠI ---
        const player = {
            x: 100, y: 100,
            width: 30, height: 38,
            vx: 0, vy: 0,
            speed: 4, jumpPower: -10, gravity: 0.5,
            hp: 100, hunger: 100,
            highestY: 100, // Để tính sát thương rơi
            inWater: false, grounded: false, dead: false,
            inv: { wood: 0, dirt: 0 }
        };

        // --- ĐỘNG VẬT (CON LỢN) ---
        const pig = {
            x: 300, y: (groundLevel - 1) * tileSize + 10,
            width: 30, height: 20,
            vx: 1, color: '#FFC0CB'
        };

        // Bàn phím
        const keys = { w: false, a: false, s: false, d: false, space: false };

        window.addEventListener('keydown', (e) => {
            let key = e.key.toLowerCase();
            if (key === 'w' || key === ' ') keys.w = true;
            if (key === 'a') keys.a = true;
            if (key === 's') keys.s = true;
            if (key === 'd') keys.d = true;
        });

        window.addEventListener('keyup', (e) => {
            let key = e.key.toLowerCase();
            if (key === 'w' || key === ' ') keys.w = false;
            if (key === 'a') keys.a = false;
            if (key === 's') keys.s = false;
            if (key === 'd') keys.d = false;
        });

        // Click chuột để đập block
        window.addEventListener('mousedown', (e) => {
            let c = Math.floor(e.clientX / tileSize);
            let r = Math.floor(e.clientY / tileSize);
            
            if (r >= 0 && r < rows && c >= 0 && c < cols) {
                let block = map[r][c];
                if (block !== 0 && block !== 5) {
                    if (block === 3) player.inv.wood++;
                    if (block === 1 || block === 2) player.inv.dirt++;
                    map[r][c] = 0; // Xóa block (thành không khí)
                    document.getElementById('inventory').innerText = `Gỗ: ${player.inv.wood} | Đất: ${player.inv.dirt}`;
                }
            }
        });

        // --- HÀM KIỂM TRA VA CHẠM VỚI BLOCK ---
        function getCollidingBlocks(x, y, w, h) {
            let blocks = [];
            let startCol = Math.floor(x / tileSize);
            let endCol = Math.floor((x + w) / tileSize);
            let startRow = Math.floor(y / tileSize);
            let endRow = Math.floor((y + h) / tileSize);

            for (let r = startRow; r <= endRow; r++) {
                for (let c = startCol; c <= endCol; c++) {
                    if (r >= 0 && r < rows && c >= 0 && c < cols) {
                        if (map[r][c] !== 0) {
                            blocks.push({ r, c, type: map[r][c] });
                        }
                    }
                }
            }
            return blocks;
        }

        // --- VÒNG LẶP CẬP NHẬT TRẠNG THÁI ---
        function update() {
            if (player.dead) return;

            // 1. Giảm thức ăn theo thời gian
            player.hunger -= 0.02;
            if (player.hunger <= 0) {
                player.hunger = 0;
                player.hp -= 0.05; // Đói quá mất máu
            }
            
            // Cập nhật UI
            document.getElementById('healthBar').style.width = player.hp + '%';
            document.getElementById('hungerBar').style.width = player.hunger + '%';
            if (player.hp <= 0) die();

            // 2. Di chuyển theo X
            if (keys.a) player.vx = -player.speed;
            else if (keys.d) player.vx = player.speed;
            else player.vx = 0;

            player.x += player.vx;
            
            // Va chạm ngang
            let collsX = getCollidingBlocks(player.x, player.y, player.width, player.height);
            collsX = collsX.filter(b => b.type !== 5); // Không kẹt bởi nước
            if (collsX.length > 0) {
                if (player.vx > 0) player.x = collsX[0].c * tileSize - player.width; // Đụng phải
                else if (player.vx < 0) player.x = collsX[0].c * tileSize + tileSize; // Đụng trái
            }

            // Giới hạn biên bản đồ
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            // 3. Di chuyển theo Y (Trọng lực & Nước)
            let collsAll = getCollidingBlocks(player.x, player.y, player.width, player.height);
            player.inWater = collsAll.some(b => b.type === 5);

            if (player.inWater) {
                player.vy += 0.1; // Bơi trọng lực yếu
                if (player.vy > 2) player.vy = 2; // Rơi chậm trong nước
                if (keys.w) player.vy = -3; // Bơi lên
                if (keys.s) player.vy = 3; // Lặn
            } else {
                player.vy += player.gravity;
            }

            player.y += player.vy;
            let collsY = getCollidingBlocks(player.x, player.y, player.width, player.height);
            collsY = collsY.filter(b => b.type !== 5);

            player.grounded = false;
            if (collsY.length > 0) {
                if (player.vy > 0) { // Đang rơi xuống chạm đất
                    player.y = collsY[0].r * tileSize - player.height;
                    player.grounded = true;
                    
                    // Xử lý sát thương rơi (Fall damage)
                    let fallDistance = (player.y - player.highestY) / tileSize;
                    if (fallDistance > 5 && !player.inWater) {
                        player.hp -= (fallDistance - 5) * 10; // Rơi cao hơn 5 block sẽ trừ máu
                    }
                    player.vy = 0;
                } else if (player.vy < 0) { // Cụng đầu trần nhà
                    player.y = collsY[0].r * tileSize + tileSize;
                    player.vy = 0;
                }
            }

            // Ghi nhớ điểm cao nhất để tính Fall Damage
            if (player.grounded || player.inWater) {
                player.highestY = player.y;
            } else if (player.y < player.highestY) {
                player.highestY = player.y;
            }

            // Nhảy
            if (keys.w && player.grounded && !player.inWater) {
                player.vy = player.jumpPower;
                player.grounded = false;
            }

            // 4. Cập nhật Động vật (Con lợn đi qua lại)
            pig.x += pig.vx;
            let pigColls = getCollidingBlocks(pig.x, pig.y, pig.width, pig.height);
            pigColls = pigColls.filter(b => b.type !== 5);
            if (pigColls.length > 0 || pig.x < 0 || pig.x > canvas.width) {
                pig.vx *= -1; // Đụng tường thì quay đầu
            }
        }

        // Xử lý khi chết
        function die() {
            player.dead = true;
            document.getElementById('deathScreen').style.display = 'flex';
        }

        // --- VÒNG LẶP VẼ ĐỒ HỌA ---
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Vẽ Mặt trời
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.arc(canvas.width - 100, 100, 40, 0, Math.PI * 2);
            ctx.fill();

            // Vẽ Bản đồ (Map)
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    let block = map[r][c];
                    if (block !== 0) {
                        ctx.fillStyle = colors[block];
                        ctx.fillRect(c * tileSize, r * tileSize, tileSize, tileSize);
                        // Vẽ viền cho các block cứng
                        if (block !== 5) {
                            ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                            ctx.strokeRect(c * tileSize, r * tileSize, tileSize, tileSize);
                        }
                    }
                }
            }

            // Vẽ con lợn
            ctx.fillStyle = pig.color;
            ctx.fillRect(pig.x, pig.y, pig.width, pig.height);
            // Vẽ mắt lợn
            ctx.fillStyle = 'black';
            ctx.fillRect(pig.vx > 0 ? pig.x + 20 : pig.x + 5, pig.y + 5, 4, 4);

            // Vẽ Người chơi
            ctx.fillStyle = '#FFdead'; // Màu da
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.fillStyle = '#1E90FF'; // Áo xanh
            ctx.fillRect(player.x, player.y + 15, player.width, 20);
            ctx.fillStyle = 'black'; // Mắt
            if (keys.d || (!keys.a && !keys.d)) ctx.fillRect(player.x + 20, player.y + 5, 4, 4); // Nhìn phải
            else ctx.fillRect(player.x + 5, player.y + 5, 4, 4); // Nhìn trái

            requestAnimationFrame(gameLoop);
        }

        function gameLoop() {
            update();
            draw();
        }

        // Bắt đầu game
        gameLoop();
    </script>
</body>
</html>
