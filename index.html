<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebCraft 3D - First Person</title>
    <style>
        body {
            margin: 0;
            overflow: hidden; /* Ẩn thanh cuộn */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #87CEEB; /* Màu nền dự phòng */
        }

        /* Dấu cộng tâm ngắm ở giữa màn hình */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            font-weight: 300;
            text-align: center;
            line-height: 20px;
            pointer-events: none; /* Click xuyên qua */
            text-shadow: 1px 1px 2px black;
            z-index: 10;
        }

        /* Màn hình Menu / Hướng dẫn ban đầu */
        #blocker {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }

        #instructions {
            text-align: center;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 30px;
            border-radius: 10px;
            cursor: pointer;
        }

        #instructions h1 { font-size: 3rem; margin-top: 0; }
        #instructions p { font-size: 1.2rem; }
    </style>

    <!-- Tải thư viện Three.js và PointerLockControls để làm góc nhìn thứ nhất -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

    <div id="crosshair">+</div>

    <div id="blocker">
        <div id="instructions">
            <h1>WebCraft 3D</h1>
            <p>Click chuột vào đây để chơi</p>
            <p><b>W, A, S, D</b> = Di chuyển | <b>Space</b> = Nhảy | <b>Chuột</b> = Xoay góc nhìn</p>
            <p><i>(Nhấn ESC để thoát chế độ chuột)</i></p>
        </div>
    </div>

    <!-- Nơi chứa đồ họa 3D -->
    <div id="gameContainer"></div>

    <script>
        // --- 1. KHỞI TẠO BIẾN CƠ BẢN ---
        let camera, scene, renderer, controls;
        const objects = []; // Mảng chứa các khối (cây cối, đất) để kiểm tra va chạm
        let raycaster;

        // Biến di chuyển
        let moveForward = false;
        let moveBackward = false;
        let moveLeft = false;
        let moveRight = false;
        let canJump = false;

        let prevTime = performance.now();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();

        // --- 2. BẮT ĐẦU THIẾT LẬP MÔI TRƯỜNG ---
        init();
        animate();

        function init() {
            // Cài đặt Scene & Bầu trời
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); /* Màu xanh da trời */
            scene.fog = new THREE.Fog(0x87CEEB, 0, 750); /* Hiệu ứng sương mù ở xa */

            // Cài đặt Camera (Góc nhìn của bạn)
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.y = 10; // Chiều cao của nhân vật

            // Ánh sáng
            const light = new THREE.HemisphereLight(0xeeeeff, 0x777788, 0.75);
            light.position.set(0.5, 1, 0.75);
            scene.add(light);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
            dirLight.position.set(20, 50, 20);
            scene.add(dirLight);

            // --- 3. ĐIỀU KHIỂN CHUỘT (POINTER LOCK) ---
            controls = new THREE.PointerLockControls(camera, document.body);
            const blocker = document.getElementById('blocker');
            const instructions = document.getElementById('instructions');

            instructions.addEventListener('click', function () {
                controls.lock(); // Khóa chuột vào giữa màn hình khi click
            });

            controls.addEventListener('lock', function () {
                instructions.style.display = 'none';
                blocker.style.display = 'none';
            });

            controls.addEventListener('unlock', function () {
                blocker.style.display = 'flex';
                instructions.style.display = 'block';
            });
            scene.add(controls.getObject());

            // --- 4. BẮT SỰ KIỆN BÀN PHÍM ---
            const onKeyDown = function (event) {
                switch (event.code) {
                    case 'ArrowUp':
                    case 'KeyW': moveForward = true; break;
                    case 'ArrowLeft':
                    case 'KeyA': moveLeft = true; break;
                    case 'ArrowDown':
                    case 'KeyS': moveBackward = true; break;
                    case 'ArrowRight':
                    case 'KeyD': moveRight = true; break;
                    case 'Space':
                        if (canJump === true) velocity.y += 150; // Lực nhảy
                        canJump = false;
                        break;
                }
            };

            const onKeyUp = function (event) {
                switch (event.code) {
                    case 'ArrowUp':
                    case 'KeyW': moveForward = false; break;
                    case 'ArrowLeft':
                    case 'KeyA': moveLeft = false; break;
                    case 'ArrowDown':
                    case 'KeyS': moveBackward = false; break;
                    case 'ArrowRight':
                    case 'KeyD': moveRight = false; break;
                }
            };

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);

            // Xử lý va chạm
            raycaster = new THREE.Raycaster(new THREE.Vector3(), new THREE.Vector3(0, - 1, 0), 0, 10);

            // --- 5. TẠO THẾ GIỚI MÀU SẮC TƯƠNG TỰ MINECRAFT ---
            
            // Tạo mặt đất
            const floorGeometry = new THREE.PlaneGeometry(2000, 2000, 100, 100);
            floorGeometry.rotateX(- Math.PI / 2); // Xoay ngang mặt đất
            const floorMaterial = new THREE.MeshLambertMaterial({ color: 0x228B22 }); // Màu cỏ
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            scene.add(floor);

            // Tạo các khối (cây, đá) rải rác
            const boxGeometry = new THREE.BoxGeometry(10, 10, 10);
            const woodMaterial = new THREE.MeshLambertMaterial({ color: 0x5C4033 }); // Màu gỗ
            
            for (let i = 0; i < 200; i++) {
                const box = new THREE.Mesh(boxGeometry, woodMaterial);
                // Vị trí ngẫu nhiên
                box.position.x = Math.floor(Math.random() * 40 - 20) * 10;
                box.position.y = 5; // Nửa chiều cao khối để nằm ngay trên mặt đất
                box.position.z = Math.floor(Math.random() * 40 - 20) * 10;
                scene.add(box);
                objects.push(box); // Đưa vào mảng để tính va chạm
            }

            // --- 6. CÀI ĐẶT RENDERER ---
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('gameContainer').appendChild(renderer.domElement);
            
            // Xử lý khi thu phóng cửa sổ
            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- 7. VÒNG LẶP XỬ LÝ CHUYỂN ĐỘNG & RENDER ---
        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();

            if (controls.isLocked === true) {
                // Tính toán thời gian giữa các khung hình (delta) giúp mượt mà
                const delta = (time - prevTime) / 1000;

                // Reset vận tốc cơ bản (ma sát)
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 500.0 * delta; // Trọng lực (kéo xuống đất)

                // Tính toán hướng đi
                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize(); // Đảm bảo đi chéo không bị nhanh hơn

                // Gia tốc di chuyển
                const moveSpeed = 400.0;
                if (moveForward || moveBackward) velocity.z -= direction.z * moveSpeed * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * moveSpeed * delta;

                // Di chuyển nhân vật
                controls.moveRight(- velocity.x * delta);
                controls.moveForward(- velocity.z * delta);

                // Xử lý trọng lực và giới hạn mặt đất
                controls.getObject().position.y += (velocity.y * delta);
                if (controls.getObject().position.y < 10) {
                    velocity.y = 0;
                    controls.getObject().position.y = 10;
                    canJump = true; // Chạm đất mới được nhảy tiếp
                }
            }

            prevTime = time;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
