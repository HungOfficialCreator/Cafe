<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cube Dash - Web Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden; /* Ngăn chặn cuộn màn hình */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; /* Ngăn trình duyệt zoom khi chạm */
        }

        #gameContainer {
            position: relative;
        }

        canvas {
            background-color: #16213e;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            border-bottom: 5px solid #0f3460;
            display: block;
        }

        #ui {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            pointer-events: none; /* Để click xuyên qua UI xuống canvas */
        }

        h1 {
            font-size: 3rem;
            margin: 0;
            text-shadow: 2px 2px 0px #e94560;
        }

        p {
            font-size: 1.2rem;
            margin-top: 10px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div id="ui">
            <h1 id="titleText">CUBE DASH</h1>
            <p id="instructionText">Chạm vào màn hình hoặc bấm Space để nhảy</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const ui = document.getElementById('ui');
        const titleText = document.getElementById('titleText');
        const instructionText = document.getElementById('instructionText');

        // Điều chỉnh kích thước canvas cho phù hợp với điện thoại
        if (window.innerWidth < 800) {
            canvas.width = window.innerWidth;
            canvas.height = window.innerWidth / 2; // Giữ tỷ lệ 2:1
        }

        // --- CÁC THÔNG SỐ GAME ---
        let frames = 0;
        let score = 0;
        let gameSpeed = 6;
        let isGameOver = false;
        let isGameStarted = false;
        let animationId;

        // Trục Y của mặt đất
        const groundY = canvas.height - 40;

        // --- ĐỐI TƯỢNG NGƯỜI CHƠI (KHỐI LẬP PHƯƠNG) ---
        const player = {
            x: 50,
            y: groundY - 40,
            width: 40,
            height: 40,
            dy: 0,           // Vận tốc theo trục Y
            jumpPower: -12,  // Lực nhảy (số âm là nhảy lên)
            gravity: 0.6,    // Trọng lực kéo xuống
            grounded: true,  // Kiểm tra xem có đang ở trên mặt đất không
            color: '#00d2ff'
        };

        // --- MẢNG CHƯỚNG NGẠI VẬT ---
        let obstacles = [];

        // --- HÀM VẼ NGƯỜI CHƠI ---
        function drawPlayer() {
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);
            
            // Vẽ viền cho khối
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 2;
            ctx.strokeRect(player.x, player.y, player.width, player.height);
        }

        // --- HÀM XỬ LÝ VẬT LÝ NGƯỜI CHƠI ---
        function updatePlayer() {
            // Áp dụng trọng lực
            player.y += player.dy;
            
            if (player.y + player.height < groundY) {
                player.dy += player.gravity; // Rơi xuống
                player.grounded = false;
            } else {
                player.dy = 0;
                player.y = groundY - player.height; // Chạm đất
                player.grounded = true;
            }
        }

        // --- HÀM ĐIỀU KHIỂN NHẢY ---
        function jump() {
            if (!isGameStarted) {
                resetGame();
                return;
            }
            if (isGameOver) {
                resetGame();
                return;
            }
            if (player.grounded) {
                player.dy = player.jumpPower;
                player.grounded = false;
            }
        }

        // --- HÀM XỬ LÝ CHƯỚNG NGẠI VẬT ---
        function handleObstacles() {
            // Cứ sau một khoảng thời gian (frames) ngẫu nhiên thì sinh ra chướng ngại vật
            if (frames % Math.floor(Math.random() * 60 + 60) === 0) {
                // Tạo chướng ngại vật hình tam giác (gai)
                obstacles.push({
                    x: canvas.width,
                    y: groundY,
                    width: 30,
                    height: 40,
                    color: '#e94560'
                });
            }

            for (let i = 0; i < obstacles.length; i++) {
                let obs = obstacles[i];
                obs.x -= gameSpeed; // Di chuyển sang trái

                // Vẽ chướng ngại vật (Hình gai nhọn)
                ctx.beginPath();
                ctx.moveTo(obs.x, obs.y); // Góc dưới trái
                ctx.lineTo(obs.x + obs.width / 2, obs.y - obs.height); // Đỉnh tam giác
                ctx.lineTo(obs.x + obs.width, obs.y); // Góc dưới phải
                ctx.fillStyle = obs.color;
                ctx.fill();
                ctx.closePath();

                // Thuật toán kiểm tra va chạm (Axis-Aligned Bounding Box)
                // Vì gai là hình tam giác, nhưng để cơ bản ta dùng hộp chữ nhật cho dễ xử lý
                if (
                    player.x < obs.x + obs.width &&
                    player.x + player.width > obs.x &&
                    player.y < obs.y &&
                    player.y + player.height > obs.y - obs.height + 10 // +10 để du di một chút ở đỉnh gai
                ) {
                    gameOver();
                }

                // Xóa chướng ngại vật khi ra khỏi màn hình để giải phóng bộ nhớ
                if (obs.x + obs.width < 0) {
                    obstacles.splice(i, 1);
                    i--;
                    score += 10; // Cứ vượt qua 1 gai là cộng 10 điểm
                }
            }
        }

        // --- VẼ MẶT ĐẤT ---
        function drawGround() {
            ctx.fillStyle = '#0f3460';
            ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
            
            // Vẽ đường line sát đất
            ctx.fillStyle = 'white';
            ctx.fillRect(0, groundY, canvas.width, 2);
        }

        // --- VẼ ĐIỂM SỐ ---
        function drawScore() {
            ctx.fillStyle = 'white';
            ctx.font = '20px Arial';
            ctx.fillText('Điểm: ' + score, 20, 30);
        }

        // --- VÒNG LẶP GAME (GAME LOOP) ---
        function animate() {
            if (isGameOver || !isGameStarted) return;

            // Xóa màn hình cũ
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawGround();
            updatePlayer();
            drawPlayer();
            handleObstacles();
            drawScore();

            // Tăng tốc độ game từ từ để khó hơn
            if (frames % 500 === 0 && gameSpeed < 15) {
                gameSpeed += 0.5;
            }

            frames++;
            animationId = requestAnimationFrame(animate);
        }

        // --- TRẠNG THÁI GAME ---
        function gameOver() {
            isGameOver = true;
            ui.classList.remove('hidden');
            titleText.innerText = "GAME OVER";
            titleText.style.color = "#e94560";
            instructionText.innerText = "Điểm của bạn: " + score + "\nChạm để chơi lại";
        }

        function resetGame() {
            player.y = groundY - player.height;
            player.dy = 0;
            obstacles = [];
            score = 0;
            frames = 0;
            gameSpeed = 6;
            isGameOver = false;
            isGameStarted = true;
            ui.classList.add('hidden');
            
            cancelAnimationFrame(animationId);
            animate();
        }

        // --- LẮNG NGHE SỰ KIỆN TƯƠNG TÁC ---
        // Nhấn chuột vào màn hình
        window.addEventListener('mousedown', jump);
        // Chạm vào màn hình điện thoại
        window.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Ngăn cuộn trang
            jump();
        });
        // Nhấn phím Space
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                jump();
            }
        });

        // Vẽ màn hình chờ ban đầu
        drawGround();
        drawPlayer();
    </script>
</body>
</html>
