<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebCraft 3D - Sinh Tồn Đa Nền Tảng</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: sans-serif; touch-action: none; user-select: none; }
        
        /* Tâm ngắm */
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 20px; pointer-events: none; text-shadow: 1px 1px 2px black; z-index: 10; }
        
        /* Màn hình chờ */
        #blocker { position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; z-index: 20; color: white; flex-direction: column; text-align: center; }
        #playBtn { padding: 15px 30px; font-size: 1.5rem; background: #228B22; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 20px; }
        
        /* Thanh trạng thái UI */
        #ui { position: absolute; top: 20px; left: 20px; z-index: 10; color: white; text-shadow: 1px 1px 2px black; font-weight: bold; pointer-events: none; }
        .bar-bg { width: 150px; height: 15px; background: rgba(0,0,0,0.5); border: 2px solid #333; margin-bottom: 10px; border-radius: 4px; }
        #hp-bar { width: 100%; height: 100%; background: #ff3333; transition: width 0.2s; }
        #food-bar { width: 100%; height: 100%; background: #ffcc00; transition: width 0.2s; }

        /* Nút điều khiển Mobile (Mặc định ẩn) */
        #mobile-controls { display: none; position: absolute; bottom: 20px; width: 100%; height: 150px; z-index: 15; pointer-events: none; }
        .btn { pointer-events: auto; background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.5); border-radius: 50%; width: 50px; height: 50px; color: white; font-size: 20px; display: flex; justify-content: center; align-items: center; position: absolute; }
        .btn:active { background: rgba(255,255,255,0.5); }
        
        /* Cụm di chuyển trái */
        #btn-w { left: 80px; bottom: 80px; }
        #btn-s { left: 80px; bottom: 20px; }
        #btn-a { left: 20px; bottom: 20px; }
        #btn-d { left: 140px; bottom: 20px; }
        
        /* Cụm hành động phải */
        #btn-jump { right: 20px; bottom: 80px; width: 60px; height: 60px; font-size: 24px; }
        #btn-break { right: 90px; bottom: 20px; width: 60px; height: 60px; font-size: 24px; background: rgba(255, 100, 100, 0.4); }
        
        #touch-look-zone { position: absolute; top: 0; right: 0; width: 50%; height: 100%; z-index: 12; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

    <div id="crosshair">✚</div>

    <div id="ui">
        Máu: <div class="bar-bg"><div id="hp-bar"></div></div>
        Thức ăn: <div class="bar-bg"><div id="food-bar"></div></div>
    </div>

    <div id="blocker">
        <h1>WebCraft 3D</h1>
        <p>PC: Dùng chuột & WASD | Mobile: Dùng phím ảo</p>
        <button id="playBtn">CHƠI NGAY</button>
    </div>

    <!-- Phím ảo Mobile -->
    <div id="mobile-controls">
        <div id="btn-w" class="btn">W</div>
        <div id="btn-a" class="btn">A</div>
        <div id="btn-s" class="btn">S</div>
        <div id="btn-d" class="btn">D</div>
        <div id="btn-jump" class="btn">▲</div>
        <div id="btn-break" class="btn">🔨</div>
    </div>
    <div id="touch-look-zone"></div>

    <div id="gameContainer"></div>

    <script>
        let camera, scene, renderer, controls;
        let interactables = []; // Mảng chứa đồ vật có thể đập
        let raycaster;
        let pig; // Con vật

        // Chỉ số sinh tồn
        let hp = 100, food = 100;

        // Trạng thái di chuyển
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, canJump = false;
        let prevTime = performance.now();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        let isMobile = /Mobi|Android/i.test(navigator.userAgent);

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 20, 200);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.y = 5;

            // Ánh sáng
            scene.add(new THREE.AmbientLight(0xaaaaaa));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(50, 100, 50);
            scene.add(dirLight);

            // --- TẠO MÔI TRƯỜNG ---
            // 1. Mặt đất (Cỏ)
            const floorGeo = new THREE.PlaneGeometry(500, 500);
            floorGeo.rotateX(-Math.PI / 2);
            const floorMat = new THREE.MeshLambertMaterial({ color: 0x4CAF50 });
            scene.add(new THREE.Mesh(floorGeo, floorMat));

            // 2. Con suối (Nước)
            const waterGeo = new THREE.PlaneGeometry(500, 30);
            waterGeo.rotateX(-Math.PI / 2);
            const waterMat = new THREE.MeshLambertMaterial({ color: 0x1E90FF, transparent: true, opacity: 0.7 });
            const water = new THREE.Mesh(waterGeo, waterMat);
            water.position.set(0, 0.2, -30); // Cao hơn đất một chút để nổi lên
            scene.add(water);

            // 3. Hàm tạo Cây cối
            const trunkMat = new THREE.MeshLambertMaterial({ color: 0x5C4033 });
            const leavesMat = new THREE.MeshLambertMaterial({ color: 0x228B22 });
            
            function createTree(x, z) {
                const trunk = new THREE.Mesh(new THREE.BoxGeometry(2, 6, 2), trunkMat);
                trunk.position.set(x, 3, z);
                scene.add(trunk);
                interactables.push(trunk); // Có thể đập thân cây

                const leaves = new THREE.Mesh(new THREE.BoxGeometry(8, 8, 8), leavesMat);
                leaves.position.set(x, 10, z);
                scene.add(leaves);
                interactables.push(leaves); // Có thể đập lá
            }

            // Rải cây ngẫu nhiên
            for(let i=0; i<30; i++) {
                let rx = Math.random() * 200 - 100;
                let rz = Math.random() * 200 - 100;
                if(rz > -15 && rz < -45) continue; // Tránh mọc cây giữa dòng suối
                createTree(rx, rz);
            }

            // 4. Động vật (Con lợn hồng)
            pig = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 3), new THREE.MeshLambertMaterial({ color: 0xFFC0CB }));
            pig.position.set(0, 1, -10);
            scene.add(pig);
            interactables.push(pig); // Có thể tương tác với vật

            // Khởi tạo Raycaster (Tia tương tác)
            raycaster = new THREE.Raycaster();

            // --- ĐIỀU KHIỂN CHUNG ---
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('gameContainer').appendChild(renderer.domElement);

            controls = new THREE.PointerLockControls(camera, document.body);
            const playBtn = document.getElementById('playBtn');
            const blocker = document.getElementById('blocker');

            playBtn.addEventListener('click', () => {
                blocker.style.display = 'none';
                if(!isMobile) controls.lock();
                else {
                    document.getElementById('mobile-controls').style.display = 'block';
                    document.getElementById('touch-look-zone').style.display = 'block';
                }
            });

            // --- SỰ KIỆN PC ---
            document.addEventListener('keydown', e => {
                if(e.code==='KeyW') moveForward=true; if(e.code==='KeyS') moveBackward=true;
                if(e.code==='KeyA') moveLeft=true;    if(e.code==='KeyD') moveRight=true;
                if(e.code==='Space' && canJump) { velocity.y += 30; canJump = false; }
            });
            document.addEventListener('keyup', e => {
                if(e.code==='KeyW') moveForward=false; if(e.code==='KeyS') moveBackward=false;
                if(e.code==='KeyA') moveLeft=false;    if(e.code==='KeyD') moveRight=false;
            });
            // Click chuột trái trên PC để đập
            document.addEventListener('mousedown', (e) => {
                if(controls.isLocked) breakBlock();
            });

            // --- SỰ KIỆN MOBILE ---
            if(isMobile) {
                const bindBtn = (id, actionDown, actionUp) => {
                    const btn = document.getElementById(id);
                    btn.addEventListener('touchstart', (e) => { e.preventDefault(); actionDown(); });
                    btn.addEventListener('touchend', (e) => { e.preventDefault(); actionUp(); });
                };
                bindBtn('btn-w', () => moveForward=true, () => moveForward=false);
                bindBtn('btn-s', () => moveBackward=true, () => moveBackward=false);
                bindBtn('btn-a', () => moveLeft=true, () => moveLeft=false);
                bindBtn('btn-d', () => moveRight=true, () => moveRight=false);
                bindBtn('btn-jump', () => { if(canJump){ velocity.y += 30; canJump = false; }}, () => {});
                
                // Nút đập đồ trên Mobile
                document.getElementById('btn-break').addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    breakBlock();
                });

                // Vuốt nửa phải màn hình để xoay Camera
                let touchX, touchY;
                const touchZone = document.getElementById('touch-look-zone');
                touchZone.addEventListener('touchstart', e => {
                    touchX = e.touches[0].pageX; touchY = e.touches[0].pageY;
                });
                touchZone.addEventListener('touchmove', e => {
                    let dx = e.touches[0].pageX - touchX;
                    let dy = e.touches[0].pageY - touchY;
                    touchX = e.touches[0].pageX; touchY = e.touches[0].pageY;
                    
                    const euler = new THREE.Euler(0, 0, 0, 'YXZ');
                    euler.setFromQuaternion(camera.quaternion);
                    euler.y -= dx * 0.005;
                    euler.x -= dy * 0.005;
                    euler.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, euler.x));
                    camera.quaternion.setFromEuler(euler);
                });
            }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        // --- HÀM ĐẬP PHÁ ---
        function breakBlock() {
            // Bắn một tia từ giữa màn hình (tâm ngắm) thẳng về phía trước
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(interactables);
            
            // Nếu tia trúng vật thể và khoảng cách gần (< 15 đơn vị)
            if (intersects.length > 0 && intersects[0].distance < 15) {
                const target = intersects[0].object;
                scene.remove(target); // Xóa khỏi đồ họa
                interactables.splice(interactables.indexOf(target), 1); // Xóa khỏi mảng
            }
        }

        // --- VÒNG LẶP GAME ---
        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            // 1. Xử lý Sinh tồn
            if(document.getElementById('blocker').style.display === 'none') {
                food -= 0.1 * delta;
                if(food <= 0) { food = 0; hp -= 1 * delta; }
                if(hp <= 0) { alert("Game Over! Bạn đã chết vì đói/mất máu."); location.reload(); }
                
                document.getElementById('hp-bar').style.width = hp + '%';
                document.getElementById('food-bar').style.width = food + '%';
            }

            // 2. Di chuyển thú vật (Lợn đi lòng vòng)
            if(pig.parent) { // Nếu lợn chưa bị đập
                pig.position.x += Math.sin(time * 0.001) * 0.05;
                pig.rotation.y = Math.sin(time * 0.001);
            }

            // 3. Di chuyển người chơi
            if (controls.isLocked || isMobile) {
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 80.0 * delta; // Trọng lực

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                const speed = 150.0;
                if (moveForward || moveBackward) velocity.z -= direction.z * speed * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * speed * delta;

                // Để di chuyển theo hướng camera, ta trích xuất góc quay Y
                const euler = new THREE.Euler(0, 0, 0, 'YXZ');
                euler.setFromQuaternion(camera.quaternion);
                
                const moveX = velocity.x * delta;
                const moveZ = velocity.z * delta;
                
                camera.position.x -= (moveX * Math.cos(euler.y) + moveZ * Math.sin(euler.y));
                camera.position.z -= (-moveX * Math.sin(euler.y) + moveZ * Math.cos(euler.y));
                camera.position.y += (velocity.y * delta);

                // Chạm đất
                if (camera.position.y < 5) {
                    velocity.y = 0;
                    camera.position.y = 5;
                    canJump = true;
                }
            }

            prevTime = time;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
